<style>
:root{
  --ink:#1B1B26; --gray:#6E6E78; --line:#DCDCE3; --card:#ECECF1;
  --accent:#1B1B26; --bg:#FFFFFF; --panel:#F7F7F9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.6}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:0;line-height:0;flex:0 1 auto;min-width:0;max-width:294px}
header h1 > svg{display:block;width:100%;height:auto}
header .sub{color:var(--gray);font-size:12px}
header .right{margin-left:auto;display:flex;align-items:center;gap:14px;white-space:nowrap;flex:none}
header .by{color:var(--gray);font-size:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:4px 9px;font-size:11px;font-weight:800;
  letter-spacing:.06em;background:#fff;color:var(--gray);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
header .by a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
header .gh{display:inline-flex;align-items:center;gap:5px;color:var(--ink);text-decoration:none;
  font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:4px 9px}
header .gh:hover{background:var(--card)}
header .gh .star{font-size:12px;line-height:1}
header .by a:hover{border-bottom-color:var(--ink)}
.wrap{display:grid;grid-template-columns:330px 1fr;gap:0;align-items:start}
.docs{margin-top:22px}
.panel{border-right:1px solid var(--line);padding:16px 18px 40px;min-height:calc(100vh - 52px)}
.stage{padding:20px 24px 60px;min-width:0}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gray);text-transform:uppercase;
  padding:0 0 6px;border-bottom:1px solid var(--line);width:100%;margin-bottom:10px}
label{display:block;margin-bottom:9px}
.row{display:flex;align-items:center;gap:8px}
.row .name{flex:1;min-width:0;font-size:12px}
.row .val{font-variant-numeric:tabular-nums;font-size:11px;color:var(--gray);width:56px;text-align:right;flex:none}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
select,input[type=number],input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--line);
  border-radius:5px;background:#fff;color:var(--ink);font:inherit;font-size:12px}
input[type=color]{width:100%;height:30px;padding:2px;border:1px solid var(--line);border-radius:5px;background:#fff}
.pair{display:flex;gap:4px}
.pair input[type=color]{min-width:0}
.pair.solid input:last-child{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wide-action{width:100%;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font:inherit;font-size:12px;font-weight:700;padding:8px 10px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink)}
button:hover{background:var(--card)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(.94)}
.preview{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:
  linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),
  linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
.preview svg{display:block;width:100%;height:auto}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--gray);font-size:11px;
  font-variant-numeric:tabular-nums;margin:8px 2px 18px}
.note{color:var(--gray);font-size:11px;margin:6px 0 0}
.hint{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;
  color:var(--gray);font-size:11px;margin:0 0 16px}
code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:11px;
  background:var(--card);padding:1px 4px;border-radius:3px;color:var(--ink)}
#params:empty::after{content:attr(data-empty);color:var(--gray);font-size:12px}
#recipe{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.5;
  border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel);color:var(--gray);
  resize:vertical;min-height:64px}
.busy{color:var(--accent);font-weight:700}

/* ── 狭い画面 ── メディアクエリは後勝ちにしたいので末尾に置く ── */
@media (max-width:900px){
  /* 狭い画面ではパターンを先に出す。操作パネルはその下 */
  .wrap{grid-template-columns:1fr}
  .stage{order:-1;padding:14px 16px 4px}
  .panel{order:0;min-height:0;border-right:0;border-top:1px solid var(--line);padding:14px 16px 26px}
  header{padding:12px 16px}
}
@media (max-width:620px){
  /* ロゴ・言語切替・作者名を1行に収める。折り返すと縦位置が揃わない */
  /* 1行に収める。項目を消さず、全体を少しずつ詰める。
     折り返すとヘッダーが高くなり、パターンがその分下がる */
  header{padding:10px 12px;gap:6px;flex-wrap:nowrap}
  header .sub{display:none}
  header h1{max-width:230px}
  header .right{gap:6px;margin-left:auto}
  header .gh{padding:3px 6px;font-size:11px;gap:4px}
  header .by{font-size:11px}
  .lang button{padding:4px 6px;font-size:10px;letter-spacing:.04em}
}
@media (max-width:420px){
  /* 長い名前を潰さず、リンクも残すため、狭い画面だけ2段にする。 */
  header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px}
  header h1{max-width:283.5px;grid-column:1;grid-row:1}
  header .right{display:contents}
  header .lang{grid-column:2;grid-row:1;justify-self:end}
  header .gh{grid-column:1;grid-row:2;justify-self:start}
  header .by{grid-column:2;grid-row:2;justify-self:end}
}
/* ── PC ── スライダーを触っている間もパターンを見えたままにする ──
   grid item の sticky はグリッドエリア内で動くので、align-self:start と
   組み合わせると左カラムの高さいっぱいまで追従する */
@media (min-width:901px){
  .stage{position:sticky;top:0;align-self:start}
}

/* ── UI study: quiet controls, a generous canvas ── */
:root{--ink:#20211f;--gray:#6b6e68;--line:#e4e5df;--card:#f0f1ed;--accent:#252823;--focus:#5f6758;--bg:#f5f5f1;--panel:#fafaf8}
body{font-size:13px;letter-spacing:.01em}
header{min-height:76px;padding:20px 28px;background:#fff;gap:20px}
header .sub{font-size:11px;letter-spacing:.045em}
header .right{gap:16px}
header .gh{border-color:transparent;background:#f5f5f2;border-radius:5px}
.lang{border-color:#e6e7e1;border-radius:5px}
.lang button{font-weight:600;padding:5px 8px}
.wrap{grid-template-columns:344px minmax(0,1fr)}
.panel{padding:24px 22px 0;background:#fff;min-height:0;display:flex;flex-direction:column;height:calc(100dvh - 76px);overflow:hidden}
.panel > fieldset{flex:none;margin:0 0 20px}
fieldset{margin:0 0 26px;min-width:0}
legend{border:0;font-size:11px;font-weight:600;letter-spacing:.06em;padding:0;margin-bottom:12px;color:#6b6e68}
#struct{font-weight:600;font-size:12px;padding:11px 12px;background:#f7f8f4;border-color:#eceee6}
#structNote{font-size:11px;line-height:1.85;margin:10px 2px 0}
.control-tabs{display:flex;border-bottom:1px solid var(--line);gap:0;flex:none}
.control-tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--gray);font-weight:500;font-size:12px;padding:12px 0;position:relative}
.control-tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.control-tabs button[aria-selected="true"]::after{content:"";height:2px;background:var(--ink);position:absolute;bottom:-1px;left:16px;right:16px}
.control-pane{overflow:auto;min-height:0;padding:24px 4px 28px 0;scrollbar-width:thin;scrollbar-color:#d4d7cd transparent}
.control-pane[hidden]{display:none}
.structure-legend{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.browse-structures{font-size:11px;font-weight:400;letter-spacing:0;color:var(--ink);text-decoration:none;border-bottom:1px solid #c7cbc0;padding-bottom:2px;white-space:nowrap}
.browse-structures:hover{color:#1644dd;border-color:#1644dd}
#pane-shape > fieldset > legend,#pane-color > fieldset > legend{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
label{margin-bottom:15px}
.row .name{font-size:11px;letter-spacing:.02em}
.row .val{font-family:ui-monospace,monospace;font-size:10px;background:#f4f5f0;border-radius:3px;padding:2px 5px;width:auto;min-width:46px;color:#53584d}
input[type=range]{appearance:none;-webkit-appearance:none;height:18px;background:transparent;margin:3px 0 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#d8dbd1;border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#33382e;margin-top:-4.5px;box-shadow:0 0 0 3px #fff}
input[type=range]::-moz-range-track{height:2px;background:#d8dbd1}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#33382e}
select,input[type=number],input[type=text]{border-color:#e3e5dc;border-radius:5px;background:#fafbf7;padding:9px 10px}
button{border-color:#dedfd8;border-radius:5px;font-size:11px;font-weight:600;padding:10px 9px;transition:background .15s,color .15s}
button:hover{background:#f0f2ea}
:where(button,a,summary,[role=tabpanel]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
:where(select,input[type=number],input[type=text],input[type=color]):focus-visible{outline:0;border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
input[type=checkbox]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--focus)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--focus)}
#shuffle{background:#f0f2eb;border-color:#e8eadf}#reset{color:#6b6e68;border-color:transparent}
.math-notes{border-top:1px solid var(--line);padding:18px 0;font-size:11px;color:var(--gray)}
.math-notes summary{cursor:pointer;color:#454a40}.docs{margin-top:16px}.hint{border:0;border-radius:4px;padding:12px;line-height:1.9}
.stage{padding:26px 36px 36px;top:0;min-height:calc(100dvh - 76px)}
.canvas-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.canvas-label{font-size:11px;color:#6b6e68;letter-spacing:.08em}
.canvas-export{background:var(--ink);color:#fff;border-color:var(--ink);padding:10px 17px}.canvas-export:hover{background:#454b3e}
.preview{border:0;border-radius:3px;box-shadow:0 2px 5px #1d25140a,0 18px 50px #1d251410;outline:1px solid #1d25140a;position:relative;isolation:isolate}
.preview.formula-transition>svg{animation:pattern-form 820ms cubic-bezier(.2,.72,.25,1) both}
.formula-intro{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none}
.preview.formula-transition>.formula-intro{animation:formula-away 820ms cubic-bezier(.2,.72,.25,1) both}
.formula-intro-inner{text-align:center;max-width:min(82%,720px);transform:translateY(-2%)}
.formula-kicker{font:9px/1.2 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.18em;opacity:.62;margin-bottom:12px}
.formula-equation{font:500 clamp(17px,2.35vw,34px)/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:-.035em;white-space:pre-line;text-wrap:balance}
.formula-name{font-size:10px;letter-spacing:.08em;margin-top:12px;opacity:.68}
@keyframes pattern-form{0%,18%{clip-path:circle(0 at 50% 50%);opacity:.08}100%{clip-path:circle(145% at 50% 50%);opacity:1}}
@keyframes formula-away{0%,26%{opacity:1}70%{opacity:.22}100%{opacity:0}}
.meta{font-size:10px;margin:18px 0 0;gap:20px;color:#818579}.meta b{font-weight:500;color:#505649}
.canvas-tip{font-size:10px;color:#7d8174;line-height:1.8;border-top:1px solid #e3e5dc;padding-top:20px;margin:32px 0 0}
.palette-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 1px 22px}
.palette-swatches button{padding:0;display:flex;height:37px;overflow:hidden;border:0;border-radius:4px;outline:1px solid #00000012;outline-offset:0}
.palette-swatches button span{width:50%;height:100%;pointer-events:none}
.palette-swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:3px}
.palette-swatches button:focus-visible{outline-color:var(--focus);outline-offset:-2px}
input[type=color]{height:46px;border-radius:5px;border:1px solid #e3e5dc;padding:4px;background:#fff;cursor:pointer}
.hex-value{display:block;font:10px ui-monospace,monospace;color:#73796b;margin-top:6px;letter-spacing:.04em}
.grid2{gap:10px}.grid3{gap:8px}.note{line-height:1.85;font-size:11px}
@media(max-width:1050px){header .sub{display:none}.stage{padding:24px}.wrap{grid-template-columns:320px minmax(0,1fr)}}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.panel{height:auto;overflow:visible;padding:22px;display:block}.control-pane{max-height:none;overflow:visible}.stage{min-height:0;position:static;padding:22px 22px 26px}.canvas-head{margin-bottom:18px}.canvas-tip{margin-top:20px;padding-top:15px}.control-tabs{position:sticky;top:0;background:#fff;z-index:2}.control-pane[hidden]{display:none}}
@media(max-width:620px){header{padding:14px 18px;gap:10px;min-height:0}header .right{gap:6px}header .lang button{padding:4px 6px}.stage{padding:18px 18px 22px}.panel{padding:20px 18px 0}.meta{gap:12px;font-size:9px}.canvas-tip{font-size:10px}.canvas-export{padding:9px 13px}}
@media(max-width:420px){header{display:grid;gap:8px 10px}header h1{max-width:283.5px}header .right{display:contents}}
@media(prefers-reduced-motion:reduce){button{transition:none}.preview.formula-transition>svg,.formula-intro{animation:none}}

</style>

<header>

  <span class="sub" id="uiSub"></span>
  <span class="right">

<div class="wrap">

      <select id="palette"></select>

        <span class="pair"><input type="color" id="fg" value="#1644dd"><input type="color" id="fg2" value="#1644dd"></span><output id="fgHex" class="hex-value"></output></label>
      <label><span class="name" id="uiBg"></span>
        <span class="pair"><input type="color" id="bg" value="#f3eedf"><input type="color" id="bg2" value="#f3eedf"></span><output id="bgHex" class="hex-value"></output></label>
    </div>
    <div class="grid2">

      <label><span class="name" style="font-size:11px" id="uiOp2"></span><input type="number" id="op2" value="1.00" min="0" max="1" step="0.02"></label>

<script>
"use strict";

/* ── ロゴ: 3×5 のドットマトリクス書体 ─────────────────────────
   このツール自身が作る絵と同じ「点の集合」で字を組む。1 が点、0 が空白。
   N は斜めを引かず、左上の肩だけで折る。 */
const GLYPH={
  M:["101","111","111","101","101"],
  H:["101","101","111","101","101"],
  G:["011","100","101","101","011"],
  P:["110","101","111","100","100"],
  A:["110","101","111","101","101"],
  T:["111","010","010","010","010"],
  E:["011","100","111","100","011"],
  R:["110","101","111","110","101"],
  N:["110","101","101","101","101"],
  L:["100","100","100","100","111"],
  B:["110","101","110","101","110"]
};
function logoSVG(text,opt){
  const o=Object.assign({cell:5, r:1.9, gap:1, space:3, color:"#1B1B26", fade:0}, opt||{});
  const rows=5, on=[], off=[];
  let cx=0;
  for(let i=0;i<text.length;i++){
    const ch=text[i].toUpperCase(), g=GLYPH[ch];
    if(!g){ cx+=o.space; continue; }   // 未定義の字と空白は送りだけ進める
    const w=g[0].length;
    for(let y=0;y<rows;y++) for(let x=0;x<w;x++){
      const px=(cx+x)*o.cell+o.cell/2, py=y*o.cell+o.cell/2;
      (g[y][x]==="1" ? on : off).push([px,py]);
    }
    cx += w + o.gap;
  }
  const W=Math.max(0,(cx-o.gap))*o.cell, H=rows*o.cell;
  const circles = a => a.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+o.r+'"/>').join("");
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'
    // 消えているセルも薄く残す。格子が見えて「点で組んだ」ことが伝わる
    + '<g fill="'+o.color+'" fill-opacity="'+o.fade+'">'+circles(off)+'</g>'
    + '<g fill="'+o.color+'">'+circles(on)+'</g></svg>';
}

// 「Gen」を小さくし、主ロゴとベースラインを揃える。
function brandLogoSVG(opt){
  const o=Object.assign({cell:5,r:1.9},opt||{}), scale=.7;
  const main=logoSVG("MATH PATTERN",o);
  const suffix=logoSVG("GEN",Object.assign({},o,{cell:o.cell*scale,r:o.r*scale}));
  const width=s=>Number(s.match(/viewBox="0 0 ([\d.]+)/)[1]);
  const x=width(main)+o.cell*3, y=5*o.cell*(1-scale);
  const W=x+width(suffix), H=5*o.cell;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'
    +main+suffix.replace('<svg ','<svg x="'+x+'" y="'+y+'" ')+'</svg>';
}

/* ── 共通: ドット配列 → 濃淡3段の SVG ───────────────────────── */
/* 角度から、キャンバス全体を覆うグラデーションの始点と終点を出す。
   objectBoundingBox だとドットの塊の外接矩形が基準になって意図とずれるので、
   userSpaceOnUse で画面座標に固定する。 */
function gradLine(W,H,deg){
  const t=deg*Math.PI/180, c=Math.cos(t), n=Math.sin(t);
  const L=Math.abs(W*c)+Math.abs(H*n);
  return {x1:(W-L*c)/2, y1:(H-L*n)/2, x2:(W+L*c)/2, y2:(H+L*n)/2};
}
/* paint = 文字列なら単色、[a,b] なら2色のグラデーション */
function paintDef(id,paint,W,H,deg){
  if(!Array.isArray(paint)) return {ref:paint, def:""};
  const g=gradLine(W,H,deg);
  return {ref:"url(#"+id+")",
    def:'<linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="'+g.x1.toFixed(1)
      +'" y1="'+g.y1.toFixed(1)+'" x2="'+g.x2.toFixed(1)+'" y2="'+g.y2.toFixed(1)+'">'
      +'<stop offset="0" stop-color="'+paint[0]+'"/><stop offset="1" stop-color="'+paint[1]+'"/>'
      +'</linearGradient>'};
}

/* 生成した SVG を同じ文書に複数貼ると url(#fgG) が最初の1枚を指してしまう。
   内容から決めた接尾辞を付けて衝突を避ける。乱数は使わない（同じ入力からは
   同じ SVG が出る、という性質を壊さないため）。 */
function paintKey(W,H,color,bg,deg){
  const src=JSON.stringify([W,H,color,bg,deg]);
  let h=2166136261;
  for(let i=0;i<src.length;i++){ h^=src.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(36);
}

function svgFromDots(W,H,dots,color,op,bg,deg){
  const tiers=[[],[],[]];
  for(const d of dots){
    if(!isFinite(d.x)||!isFinite(d.y)||!isFinite(d.r)) continue;
    if(d.x<-d.r||d.x>W+d.r||d.y<-d.r||d.y>H+d.r) continue;
    const i = d.r<1.7 ? 0 : (d.r<3.4 ? 1 : 2), r=d.r;
    tiers[i].push('M'+(d.x-r).toFixed(1)+' '+d.y.toFixed(1)
      +'a'+r.toFixed(2)+' '+r.toFixed(2)+' 0 1 0 '+(2*r).toFixed(2)+' 0'
      +'a'+r.toFixed(2)+' '+r.toFixed(2)+' 0 1 0 '+(-2*r).toFixed(2)+' 0');
  }
  deg = (deg==null) ? 90 : deg;
  const k=paintKey(W,H,color,bg,deg);
  const fp=paintDef("fg-"+k,color,W,H,deg), bp=paintDef("bg-"+k,bg,W,H,deg);
  const defs=(fp.def||bp.def) ? "<defs>"+bp.def+fp.def+"</defs>" : "";
  const rect = bg ? '<rect width="'+W+'" height="'+H+'" fill="'+bp.ref+'"/>' : '';
  const paths = tiers.map((t,i)=> t.length
    ? '<path d="'+t.join('')+'" fill="'+fp.ref+'" fill-opacity="'+op[i]+'"/>' : '').join('');
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H
    +'" viewBox="0 0 '+W+' '+H+'">'+defs+rect+paths+'</svg>';
}

const clamp01 = x => Math.max(0, Math.min(1, x));
// 内外を滑らかに閉じる窓（両端でゼロ）
function win(a,b,p){ return r=>{ const t=(r-a)/(b-a); return (t<0||t>1)?0:Math.pow(Math.sin(Math.PI*t), p||0.6); }; }

/* ── 構造の定義 ──────────────────────────────────────────── */
const S = {};

/* 極格子（ギヨシェ）。半径も角度も一定ピッチ、濃淡は解析関数だけ */
S.polar = {
  label:{ja:"極格子（ギヨシェ）",en:"Polar lattice (guilloché)"},
  note:{"ja":"同心円に点を並べると、大きな波が見えてくる。間隔とねじれを変えて、静かなうねりから細かな織り目まで。","en":"Dots on concentric circles become sweeping waves. Change the spacing and twist to move from gentle swells to a fine weave."},
  doc:{"ja":"<b>極格子のしくみ</b><br>半径は <code>r = r₀ + i·dr</code>、濃淡は <code>0.5 + 0.5·cos(kθ + ar)</code>。<br><b>点の並べ方</b> — 等弧長 <code>dθ = ds/r</code> なら間隔が揃い、等角なら放射状の筋が現れます。<br><b>帯を太くする</b> — <code>hi</code> を下げると、大きなドットの領域が広がります。粒径も上げると、点がつながって面になります。<br><b>四隅まで広げる</b> — 内半径は画面までの最短距離より小さく、外半径は最も遠い角まで届くように。中心を画面外へ置くと、流れが引き立ちます。","en":"<b>How the polar lattice works</b><br>Radii follow <code>r = r₀ + i·dr</code>; tone follows <code>0.5 + 0.5·cos(kθ + ar)</code>.<br><b>Dot spacing</b> — Equal arc length, <code>dθ = ds/r</code>, keeps spacing uniform. Equal angles reveal radial lines.<br><b>Broader bands</b> — Lower <code>hi</code> to expand the largest dots. Increase their size to merge them into solid areas.<br><b>Reach the corners</b> — Keep the inner radius below the nearest point of the canvas and the outer radius beyond its farthest corner. An off-canvas center brings out the flow."},
  params:[
    {k:"cx",  l:{ja:"中心 x",en:"Center x"},        min:-1200,max:2600,step:10, d:1300},
    {k:"cy",  l:{ja:"中心 y",en:"Center y"},        min:-1200,max:2200,step:10, d:760},
    {k:"r0",  l:{ja:"内半径 r0",en:"Inner radius r0"},     min:20,  max:900,  step:10, d:160},
    {k:"r1",  l:{ja:"外半径 r1",en:"Outer radius r1"},     min:200, max:2600, step:10, d:1520},
    {k:"dr",  l:{ja:"リング間隔 dr",en:"Ring pitch dr"}, min:6,   max:60,   step:1,  d:15},
    {k:"ds",  l:{ja:"弧の点間隔 ds",en:"Arc spacing ds"}, min:4,   max:40,   step:1,  d:11},
    {k:"mode",l:{ja:"角度ピッチ",en:"Angular pitch"},    opts:[["arc",{ja:"等弧長（スポークなし）",en:"Equal arc length (no spokes)"}],["angle",{ja:"等角（スポークが立つ）",en:"Equal angle (spokes appear)"}]], d:"arc"},
    {k:"dth", l:{ja:"等角の分割数",en:"Angular divisions"},  min:80,  max:1400, step:20, d:560},
    {k:"k",   l:{ja:"周方向の本数 k",en:"Angular count k"},min:1,   max:14,   step:1,  d:3},
    {k:"a",   l:{ja:"ねじれ a",en:"Twist a"},      min:0,   max:0.08, step:0.002,d:0.014},
    {k:"ph",  l:{ja:"位相",en:"Phase"},          min:0,   max:6.28, step:0.05, d:0.9},
    {k:"beat",l:{ja:"うなり",en:"Beat"},        min:0,   max:1.2,  step:0.05, d:0},
    {k:"lo",  l:{ja:"平坦部 lo",en:"Plateau lo"},     min:0,   max:0.6,  step:0.02, d:0},
    {k:"hi",  l:{ja:"平坦部 hi",en:"Plateau hi"},     min:0.2, max:1,    step:0.02, d:1},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},      min:0.2, max:3,    step:0.1,  d:0.6},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},      min:1,   max:10,   step:0.2,  d:4.6},
    {k:"pow", l:{ja:"階調カーブ",en:"Tone curve"},    min:0.4, max:3,    step:0.05, d:1.7}
  ],
  gen(p,W,H){
    const out=[], env=win(p.r0-20, p.r1+20, 0.6);
    for(let i=0, r=p.r0; r<=p.r1; i++, r=p.r0+i*p.dr){
      const step = (p.mode==="angle") ? (Math.PI*2/p.dth) : (p.ds/r);
      for(let th=0; th<Math.PI*2; th+=step){
        const x=p.cx+r*Math.cos(th), y=p.cy+r*Math.sin(th);
        if(x<-25||x>W+25||y<-25||y>H+25) continue;
        let base = p.k*th + p.a*r + p.ph;
        if(p.beat>0) base += p.beat*Math.sin(2*th - r*0.006);
        const raw = 0.5+0.5*Math.cos(base);
        const m = clamp01((raw-p.lo)/Math.max(1e-6, p.hi-p.lo)) * clamp01(env(r));
        const rd = p.rmin+(p.rmax-p.rmin)*Math.pow(m, p.pow);
        if(rd>0.42) out.push({x,y,r:rd});
      }
    }
    return out;
  }
};

/* ねじれたリボン。射影の潰れがそのまま濃淡になる */
S.ribbon = {
  label:{ja:"ねじれたリボン（線織面の正射影）",en:"Twisted ribbon (ruled surface, orthographic)"},
  note:{"ja":"点でできたリボンを、ゆっくりねじる。折り重なるところが濃くなり、平面の上に奥行きが生まれます。","en":"Twist a ribbon made of dots. Where the rows overlap, they grow darker and give the flat image a sense of depth."},
  doc:{"ja":"<b>リボンのしくみ</b><br>軸 <code>P(u)</code> に沿って幅を広げ、<code>τ(u)</code> で回転させた面を投影します。<code>cos τ → 0</code> で幅方向の点列が重なり、濃い帯になります。<br>粒径には、面の向きと奥行きも反映しています。<br><b>点を残すコツ</b> — 幅方向の分割は17〜22あたりから。点がつながりすぎるときは、分割数を減らして隙間を作ってみてください。","en":"<b>How the ribbon works</b><br>A surface extends across the axis <code>P(u)</code>, turns by <code>τ(u)</code>, then projects onto the canvas. As <code>cos τ → 0</code>, its rows overlap into a darker band.<br>Dot size also responds to orientation and depth.<br><b>Keep the dots visible</b> — Start with 17–22 width divisions. If too many dots merge, reduce the divisions to open up the spacing."},
  params:[
    {k:"Nu",  l:{ja:"軸方向の分割",en:"Axis divisions"},  min:60, max:600, step:10, d:300},
    {k:"Nv",  l:{ja:"幅方向の分割",en:"Width divisions"},  min:6,  max:60,  step:1,  d:17},
    {k:"HW",  l:{ja:"半幅",en:"Half width"},          min:40, max:400, step:5,  d:210},
    {k:"len", l:{ja:"軸の長さ",en:"Axis length"},      min:600,max:2600,step:20, d:1760},
    {k:"x0",  l:{ja:"始点 x",en:"Start x"},        min:-800,max:600,step:10, d:-260},
    {k:"y0",  l:{ja:"始点 y",en:"Start y"},        min:-200,max:900, step:10, d:430},
    {k:"drop",l:{ja:"軸の下り",en:"Axis drop"},      min:-600,max:600, step:10, d:250},
    {k:"bend",l:{ja:"軸の反り",en:"Axis bend"},      min:0,  max:400, step:10, d:150},
    {k:"bf",  l:{ja:"反りの周期",en:"Bend period"},    min:0.4,max:3,   step:0.1, d:1.1},
    {k:"turn",l:{ja:"ねじれ回転数",en:"Twist turns"},  min:0.2,max:4,   step:0.1, d:2.2},
    {k:"tau0",l:{ja:"ねじれ初期角",en:"Initial twist angle"},  min:0,  max:6.28,step:0.05,d:0.2},
    {k:"persp",l:{ja:"遠近の強さ",en:"Perspective"},   min:600,max:6000,step:100,d:1600},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},      min:0.2,max:3,   step:0.05,d:0.45},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},      min:1,  max:8,   step:0.1, d:3.45},
    {k:"fpow",l:{ja:"潰れのカーブ",en:"Foreshortening curve"},  min:0.3,max:2,   step:0.05,d:0.75}
  ],
  gen(p,W,H){
    const out=[];
    for(let iu=0; iu<=p.Nu; iu++){
      const u=iu/p.Nu;
      const px=p.x0+u*p.len, py=p.y0-u*p.drop+p.bend*Math.sin(Math.PI*u*p.bf);
      const tx=p.len/p.Nu, ty=(-p.drop/p.Nu)+p.bend*Math.PI*p.bf*Math.cos(Math.PI*u*p.bf)/p.Nu;
      const tl=Math.hypot(tx,ty)||1, nx=-ty/tl, ny=tx/tl;
      const tau=p.tau0+p.turn*Math.PI*u, ct=Math.cos(tau), st=Math.sin(tau);
      for(let iv=0; iv<=p.Nv; iv++){
        const v=-1+2*iv/p.Nv, off=v*p.HW, z=off*st;
        const s=p.persp/Math.max(1,(p.persp-z));
        const x=(px+off*ct*nx-W/2)*s+W/2, y=(py+off*ct*ny-H/2)*s+H/2;
        if(x<-20||x>W+20||y<-20||y>H+20) continue;
        const fore=Math.abs(ct), depth=(z/p.HW+1)/2;
        out.push({x,y,r:(p.rmin+(p.rmax-p.rmin)*Math.pow(fore,p.fpow))*(0.62+0.55*depth)});
      }
    }
    return out;
  }
};

/* ひらっとした布。射影の潰れ＋法線陰影 */
S.cloth = {
  label:{ja:"ひらっとした布（波打つ面＋法線陰影）",en:"Draped cloth (wavy surface + normal shading)"},
  note:{"ja":"布がふわりと波打つように、点の列がたわむ。光の向きと面の傾きで、やわらかな陰影をつくります。","en":"Rows of dots bend like a rippling sheet of cloth. Light and surface tilt give the pattern its soft shading."},
  doc:{"ja":"<b>布のしくみ</b><br>高さ <code>h(u,v)</code> を持つ面を、俯角 <code>α</code> から投影します。点列の詰まり方と、法線と光の内積 <code>max(0, N·L)</code> による粒径が、面の表情を作ります。<br><b>まずは少ない分割で</b> — 奥行きの分割は20前後から。広がりや俯角に合わせて増やし、点が面に潰れる手前を探してみてください。<br><b>陰影を変える</b> — 光の向きと陰影のカーブで、折れ目の見え方を調整できます。","en":"<b>How the cloth works</b><br>A surface with height <code>h(u,v)</code> is projected from tilt <code>α</code>. Row spacing and dot size from <code>max(0, N·L)</code>, the surface normal dotted with the light direction, make it read as a sheet.<br><b>Start with fewer divisions</b> — Try about 20 depth divisions, then add more to suit the extent and tilt. Stop before the dots merge into a solid fill.<br><b>Shape the shading</b> — Adjust the light direction and shading curve to bring out the folds."},
  params:[
    {k:"Nu",  l:{ja:"横の分割",en:"Divisions (u)"},      min:60, max:600, step:10, d:270},
    {k:"Nv",  l:{ja:"奥行きの分割",en:"Depth divisions"},  min:6,  max:60,  step:1,  d:22},
    {k:"Lx",  l:{ja:"横の広がり",en:"Width extent"},    min:600,max:2600,step:20, d:1620},
    {k:"Lz",  l:{ja:"奥行きの広がり",en:"Depth extent"},min:300,max:2000,step:20, d:960},
    {k:"alpha",l:{ja:"俯角",en:"Camera tilt"},         min:0.05,max:1.2,step:0.02,d:0.24},
    {k:"amp0",l:{ja:"振幅（基準）",en:"Amplitude (base)"},  min:0,  max:300, step:5,  d:70},
    {k:"amp1",l:{ja:"振幅（端で増）",en:"Amplitude (edge gain)"},min:0,  max:300, step:5,  d:95},
    {k:"apow",l:{ja:"振幅のカーブ",en:"Amplitude curve"},  min:0.3,max:3,   step:0.1, d:1.6},
    {k:"fu",  l:{ja:"横の波の数",en:"Wave count (u)"},    min:0.3,max:5,   step:0.05,d:1.65},
    {k:"fv",  l:{ja:"奥行きの波の数",en:"Wave count (depth)"},min:0,  max:5,   step:0.05,d:1.25},
    {k:"tw",  l:{ja:"ねじり",en:"Twist"},        min:0,  max:1.6, step:0.05,d:0.55},
    {k:"lx",  l:{ja:"光 x",en:"Light x"},          min:-1, max:1,   step:0.05,d:-0.30},
    {k:"ly",  l:{ja:"光 y",en:"Light y"},          min:-1, max:1,   step:0.05,d:0.42},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},      min:0.2,max:3,   step:0.05,d:0.5},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},      min:1,  max:8,   step:0.1, d:3.4},
    {k:"gamma",l:{ja:"陰影のカーブ",en:"Shading curve"}, min:0.4,max:3,   step:0.05,d:1.6},
    {k:"ox",  l:{ja:"位置 x",en:"Offset x"}, min:-2000,max:2000,step:10, d:0},
    {k:"oy",  l:{ja:"位置 y",en:"Offset y"}, min:-2000,max:2000,step:10, d:0},
  ],
  gen(p,W,H){
    const h=(u,v)=>{
      const tw=p.tw*Math.PI*(u-0.5);
      const amp=p.amp0+p.amp1*Math.pow(Math.max(0,u), p.apow);
      return amp*Math.sin(p.fu*Math.PI*u + p.fv*Math.PI*v + tw);
    };
    const ca=Math.cos(p.alpha), sa=Math.sin(p.alpha), e=0.004, out=[];
    // 光ベクトルは必ず正規化する。lx²+ly²>1 のとき lz を 0 で止めるだけだと
    // 長さが 1 を超え、ランバート項が 1 を超えて粒径が rmax を突き抜ける
    const lz0=Math.sqrt(Math.max(0, 1-p.lx*p.lx-p.ly*p.ly));
    const ll=Math.hypot(p.lx, p.ly, lz0)||1;
    const Lx_=p.lx/ll, Ly_=p.ly/ll, Lz_=lz0/ll;
    for(let iv=0; iv<=p.Nv; iv++){ const v=iv/p.Nv;
      for(let iu=0; iu<=p.Nu; iu++){ const u=iu/p.Nu;
        const X=(u-0.5)*p.Lx, Y=(v-0.5)*p.Lz, Z=h(u,v);
        // 探り点を定義域に収める（端は片側差分）
        const u0=Math.max(0,u-e), u1=Math.min(1,u+e);
        const v0=Math.max(0,v-e), v1=Math.min(1,v+e);
        const hu=(h(u1,v)-h(u0,v))/((u1-u0)*p.Lx), hv=(h(u,v1)-h(u,v0))/((v1-v0)*p.Lz);
        let nx=-hu, ny=-hv, nz=1; const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
        const lam=Math.max(0, nx*Lx_+ny*Ly_+nz*Lz_);
        const sx=W/2+p.ox+X, sy=H/2+p.oy+(Y*sa-Z*ca);
        if(sx<-25||sx>W+25||sy<-25||sy>H+25) continue;
        out.push({x:sx, y:sy, r:p.rmin+(p.rmax-p.rmin)*Math.pow(0.18+0.82*lam, p.gamma)});
      }}
    return out;
  }
};

/* 等角写像。角度を保つので歪んでも破綻しない */
S.conformal = {
  label:{ja:"等角写像（z² / z+1/z）",en:"Conformal map (z² / z+1/z)"},
  note:{"ja":"整った格子を、曲線の網へ。交わる角度を保ちながら、点の流れを大きく曲げていきます。","en":"Turn a regular grid into a net of curves. The lines bend while keeping their crossing angles."},
  doc:{"ja":"<b>等角写像のしくみ</b><br><code>w = z²</code> は格子を放物線の網へ、<code>w = z + 1/z</code> は円の周りの流れを翼の周りのような流れへ写します。<br>粒径は <code>|dw/dz|</code> と位置による濃淡を組み合わせています。<br><b>流れを見せるコツ</b> — 原点や特異点を画面外へ移すと、中心の形ではなく曲線の広がりが主役になります。","en":"<b>How the conformal map works</b><br><code>w = z²</code> turns a grid into a net of parabolas. <code>w = z + 1/z</code> maps flow around a circle to flow around an aerofoil.<br>Dot sizes combine <code>|dw/dz|</code> with a positional tone ramp.<br><b>Bring out the flow</b> — Move the origin or singularity outside the canvas so the curves, rather than the center, lead the composition."},
  params:[
    {k:"fn", l:{ja:"写像",en:"Mapping"},       opts:[["z2",{ja:"w = z²",en:"w = z²"}],["jouk",{ja:"w = z + 1/z",en:"w = z + 1/z"}]], d:"z2"},
    {k:"cx", l:{ja:"配置 x",en:"Position x"},     min:-1200,max:2600,step:10, d:1180},
    {k:"cy", l:{ja:"配置 y",en:"Position y"},     min:-1200,max:2200,step:10, d:880},
    {k:"sc", l:{ja:"スケール",en:"Scale"},   min:40,  max:800, step:10, d:226},
    {k:"Na", l:{ja:"a の分割",en:"a divisions"},   min:60,  max:900, step:20, d:460},
    {k:"Nb", l:{ja:"b の分割",en:"b divisions"},   min:12,  max:260, step:4,  d:96},
    {k:"a0", l:{ja:"a 下限",en:"a min"},     min:-4,  max:2,   step:0.05,d:-2.85},
    {k:"a1", l:{ja:"a 上限",en:"a max"},     min:-2,  max:4,   step:0.05,d:0.90},
    {k:"b0", l:{ja:"b 下限",en:"b min"},     min:0.02,max:3,   step:0.02,d:0.42},
    {k:"b1", l:{ja:"b 上限",en:"b max"},     min:0.2, max:5,   step:0.05,d:2.77},
    {k:"mix",l:{ja:"幾何と位置の配合",en:"Geometry / position mix"},min:0,max:1,step:0.05,d:0.45},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},  min:0.2, max:3,   step:0.05,d:0.30},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},  min:1,   max:8,   step:0.1, d:2.95},
    {k:"pow", l:{ja:"階調カーブ",en:"Tone curve"},min:0.4, max:3,   step:0.05,d:2.0}
  ],
  gen(p,W,H){
    const out=[];
    for(let ia=0; ia<=p.Na; ia++){
      const a=p.a0+(p.a1-p.a0)*ia/p.Na;
      for(let ib=0; ib<=p.Nb; ib++){
        const b=p.b0+(p.b1-p.b0)*ib/p.Nb;
        let wx,wy,jac;
        if(p.fn==="jouk"){
          const d=a*a+b*b; if(d<1e-6) continue;
          wx=a+a/d; wy=b-b/d;
          // |dw/dz| = |1 − 1/z²|。z² = (a²−b²) + i·2ab、1/z² = conj(z²)/|z²|²
          const d2=d*d;
          jac=Math.hypot(1-(a*a-b*b)/d2, 2*a*b/d2);
        }else{
          wx=a*a-b*b; wy=2*a*b; jac=2*Math.hypot(a,b);
        }
        const x=p.cx+wx*p.sc, y=p.cy-wy*p.sc;
        if(x<-25||x>W+25||y<-25||y>H+25) continue;
        const geo=clamp01(2.6/(0.5+jac));
        const ramp=clamp01((x/W)*0.55+(y/H)*0.62);
        const r=p.rmin+(p.rmax-p.rmin)*Math.pow(geo*p.mix+ramp*(1-p.mix), p.pow);
        if(r>0.42) out.push({x,y,r});
      }
    }
    return out;
  }
};

/* 歪ませた等高線（水面） */
S.contour = {
  label:{ja:"歪ませた等高線（水面）",en:"Warped contours (water)"},
  note:{"ja":"水面にも、地形にも見える、なだらかな帯。波を重ねて、等高線のような濃淡を描きます。","en":"Soft bands that suggest water or terrain. Layer a few waves to draw tones like contour lines."},
  doc:{"ja":"<b>等高線のしくみ</b><br>複数の波を足した場 <code>f</code> の小数部を、帯の断面へ変換します。<code>Math.pow(ph, skew)</code> で断面を非対称にすると、帯に流れる向きが生まれます。<br><b>軽さを調整する</b> — 「帯の細さ」は2前後から。小さくすると太く重厚に、大きくすると細く軽やかになります。","en":"<b>How the contours work</b><br>The fractional part of a wave field <code>f</code> becomes a band profile. <code>Math.pow(ph, skew)</code> makes the profile asymmetric and gives the bands a direction.<br><b>Adjust the visual weight</b> — Start with band thinness near 2. Lower values make broader, heavier bands; higher values make finer, lighter ones."},
  params:[
    {k:"step",l:{ja:"格子の間隔",en:"Sample spacing"},   min:4,  max:20,  step:0.5, d:7.5},
    {k:"a1", l:{ja:"波1 振幅",en:"Wave 1 amplitude"},      min:0,  max:2,   step:0.05,d:1.00},
    {k:"f1u",l:{ja:"波1 横周波数",en:"Wave 1 freq u"},  min:0,  max:8,   step:0.1, d:2.1},
    {k:"f1v",l:{ja:"波1 縦周波数",en:"Wave 1 freq v"},  min:0,  max:8,   step:0.1, d:0.9},
    {k:"a2", l:{ja:"波2 振幅",en:"Wave 2 amplitude"},      min:0,  max:2,   step:0.05,d:0.62},
    {k:"f2u",l:{ja:"波2 横周波数",en:"Wave 2 freq u"},  min:-8, max:8,   step:0.1, d:-1.6},
    {k:"f2v",l:{ja:"波2 縦周波数",en:"Wave 2 freq v"},  min:0,  max:8,   step:0.1, d:3.4},
    {k:"a3", l:{ja:"波3 振幅",en:"Wave 3 amplitude"},      min:0,  max:2,   step:0.05,d:0.38},
    {k:"f3u",l:{ja:"波3 横周波数",en:"Wave 3 freq u"},  min:0,  max:12,  step:0.1, d:5.3},
    {k:"f3v",l:{ja:"波3 縦周波数",en:"Wave 3 freq v"},  min:0,  max:12,  step:0.1, d:3.1},
    {k:"gain",l:{ja:"うねりの強さ",en:"Swell strength"}, min:0.2,max:4,   step:0.05,d:1.55},
    {k:"tx", l:{ja:"帯の傾き x",en:"Band slope x"},    min:0,  max:0.02,step:0.0002,d:0.0042},
    {k:"ty", l:{ja:"帯の傾き y",en:"Band slope y"},    min:0,  max:0.02,step:0.0002,d:0.0026},
    {k:"skew",l:{ja:"断面の非対称",en:"Profile skew"}, min:0.2,max:2,   step:0.02,d:0.62},
    {k:"width",l:{ja:"帯の細さ",en:"Band thinness"},    min:0.6,max:5,   step:0.1, d:2.0},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},     min:0.2,max:3,   step:0.05,d:0.28},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},     min:1,  max:8,   step:0.1, d:2.85},
    {k:"ox",  l:{ja:"位置 x",en:"Offset x"}, min:-2000,max:2000,step:10, d:0},
    {k:"oy",  l:{ja:"位置 y",en:"Offset y"}, min:-2000,max:2000,step:10, d:0},
  ],
  gen(p,W,H){
    const out=[];
    const surf=(x,y)=>{ const u=x/W, v=y/H;
      return p.a1*Math.sin(p.f1u*u+p.f1v*v+0.4)
           + p.a2*Math.sin(p.f2v*v+p.f2u*u+2.1)
           + p.a3*Math.sin(p.f3u*u+p.f3v*v-1.2); };
    for(let y=2; y<H; y+=p.step){ for(let x=2; x<W; x+=p.step){
      const xs=x-p.ox, ys=y-p.oy;                 // 場だけずらす
      const f=surf(xs,ys)*p.gain + (p.tx*xs + p.ty*ys);
      const ph=f-Math.floor(f);
      const prof=Math.pow(Math.sin(Math.PI*Math.pow(ph, p.skew)), p.width);
      const r=p.rmin+(p.rmax-p.rmin)*prof;
      if(r>0.5) out.push({x,y,r});
    }}
    return out;
  }
};

/* モアレ */
S.moire = {
  label:{ja:"モアレ（二重格子）",en:"Moiré (two lattices)"},
  note:{"ja":"わずかなずれから、大きなリズムが生まれる。2枚の格子の間隔と角度を変えて、干渉模様を探ります。","en":"A tiny offset becomes a large rhythm. Adjust the spacing and angle of two grids to explore their interference."},
  doc:{"ja":"<b>モアレのしくみ</b><br>格子1の各点から、回転・拡大した格子2の最寄りの点までの距離を粒径にしています。<br><b>大きな模様にする</b> — <code>p1</code> と <code>p2</code> の差や角度差を小さくすると、干渉縞の周期が大きくなります。少しずつ動かすと、変化がよく見えます。","en":"<b>How moiré works</b><br>At each point in grid 1, dot size follows the distance to the nearest point in a rotated and scaled grid 2.<br><b>Make the pattern broader</b> — Smaller pitch and angle differences create larger interference periods. Move the controls in small steps to see the change."},
  params:[
    {k:"p1",  l:{ja:"格子1 ピッチ",en:"Lattice 1 pitch"}, min:6,  max:40, step:0.5, d:15},
    {k:"p2",  l:{ja:"格子2 ピッチ",en:"Lattice 2 pitch"}, min:6,  max:40, step:0.1, d:15.9},
    {k:"ang", l:{ja:"角度（度）",en:"Angle (deg)"},   min:0,  max:30, step:0.1, d:7.5},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},     min:0.2,max:3,  step:0.05,d:0.5},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},     min:1,  max:9,  step:0.1, d:5.1},
    {k:"pow", l:{ja:"階調カーブ",en:"Tone curve"},   min:0.4,max:3,  step:0.05,d:1.5},
    {k:"ox",  l:{ja:"位置 x",en:"Offset x"}, min:-2000,max:2000,step:10, d:0},
    {k:"oy",  l:{ja:"位置 y",en:"Offset y"}, min:-2000,max:2000,step:10, d:0},
  ],
  gen(p,W,H){
    const out=[], a=p.ang*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
    for(let y=-20; y<H+20; y+=p.p1){ for(let x=-20; x<W+20; x+=p.p1){
      const dx=x-W/2-p.ox, dy=y-H/2-p.oy;
      const rx=dx*ca+dy*sa, ry=-dx*sa+dy*ca;
      const fx=rx/p.p2-Math.round(rx/p.p2), fy=ry/p.p2-Math.round(ry/p.p2);
      const d=Math.hypot(fx,fy)/0.7071;
      const m=Math.max(0,1-d);
      out.push({x,y,r:p.rmin+(p.rmax-p.rmin)*Math.pow(m,p.pow)});
    }}
    return out;
  }
};

/* 準結晶 */
S.quasi = {
  label:{ja:"準結晶（N枚の平面波の和）",en:"Quasicrystal (sum of N plane waves)"},
  note:{"ja":"規則はあるのに、同じ並びを繰り返さない。5方向や7方向の波が重なって、結晶のような模様が現れます。","en":"Ordered, but never quite repeating. Waves from five or seven directions meet in a pattern that resembles a crystal."},
  doc:{"ja":"<b>準結晶のしくみ</b><br><code>Σⱼ cos(k·(x cosθⱼ + y sinθⱼ) + ψⱼ)</code>、<code>θⱼ = 2πj/N</code>。複数方向の平面波を足し合わせます。<br><code>N=4</code> なら周期的、<code>N=5・7</code> なら非周期の模様になります。<br><b>細かさを変える</b> — 波数 <code>k</code> を上げると細かく、下げると大きな形になります。","en":"<b>How the quasicrystal works</b><br><code>Σⱼ cos(k·(x cosθⱼ + y sinθⱼ) + ψⱼ)</code>, with <code>θⱼ = 2πj/N</code>, adds plane waves from several directions.<br><code>N=4</code> is periodic; <code>N=5 or 7</code> gives an aperiodic pattern.<br><b>Change the scale</b> — Raise wave number <code>k</code> for finer detail, or lower it for broader forms."},
  params:[
    {k:"N",   l:{ja:"波の枚数",en:"Number of waves"},   min:3,  max:9,   step:1,   d:5},
    {k:"k",   l:{ja:"波数 k",en:"Wave number k"},     min:0.01,max:0.2,step:0.005,d:0.055},
    {k:"step",l:{ja:"格子の間隔",en:"Sample spacing"}, min:4,  max:20,  step:0.5, d:9},
    {k:"bias",l:{ja:"しきい値",en:"Threshold"},   min:0,  max:1,   step:0.02,d:0.45},
    {k:"span",l:{ja:"レンジ",en:"Range"},     min:0.4,max:2.5, step:0.05,d:1.3},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},   min:0.2,max:3,   step:0.05,d:0.4},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},   min:1,  max:8,   step:0.1, d:4.8},
    {k:"pow", l:{ja:"階調カーブ",en:"Tone curve"}, min:0.4,max:4,   step:0.05,d:2.2},
    {k:"ox",  l:{ja:"位置 x",en:"Offset x"}, min:-2000,max:2000,step:10, d:0},
    {k:"oy",  l:{ja:"位置 y",en:"Offset y"}, min:-2000,max:2000,step:10, d:0},
  ],
  gen(p,W,H){
    const out=[], N=Math.round(p.N), ph=[];
    for(let j=0;j<N;j++) ph.push((j*1.17)%(Math.PI*2));   // 位相は固定（決定的）
    for(let y=0; y<H; y+=p.step){ for(let x=0; x<W; x+=p.step){
      let s=0;
      for(let j=0;j<N;j++){ const a=Math.PI*2*j/N;
        s+=Math.cos(p.k*((x-W*0.47-p.ox)*Math.cos(a)+(y-H*0.48-p.oy)*Math.sin(a))+ph[j]); }
      const m=clamp01((s+N*p.bias)/(N*p.span));
      const r=p.rmin+(p.rmax-p.rmin)*Math.pow(m,p.pow);
      if(r>0.55) out.push({x,y,r});
    }}
    return out;
  }
};

/* ギブス現象 */
S.gibbs = {
  label:{ja:"ギブス現象（フーリエ部分和）",en:"Gibbs phenomenon (Fourier partial sum)"},
  note:{"ja":"なめらかな波を重ねると、角の近くに小さな揺れが残る。その消えない揺れを、点の列で描きます。","en":"Add smooth waves together and a small ripple remains near each sharp edge. Rows of dots make that persistent ringing visible."},
  doc:{"ja":"<b>ギブス現象のしくみ</b><br>矩形波を <code>(4/π)·Σ sin(nkx)/n</code>（奇数 <code>n ≤ N</code>）で近似します。<br>項数を増やすと矩形に近づきますが、不連続の近くには段差の約9%の行き過ぎが残ります。<br><b>変化を読む</b> — 行が進むにつれて項数が増えます。「最大項数」と「項数の増え方」で、波から角へ移る様子を調整できます。","en":"<b>How the Gibbs phenomenon works</b><br>A square wave is approximated by <code>(4/π)·Σ sin(nkx)/n</code> for odd <code>n ≤ N</code>.<br>More terms sharpen the edges, but an overshoot of about 9% of the jump remains near each discontinuity.<br><b>Read the transition</b> — The term count grows row by row. Max terms and term growth control the transition from waves to corners."},
  params:[
    {k:"rows",l:{ja:"行数",en:"Rows"},       min:12, max:140, step:2,  d:64},
    {k:"cols",l:{ja:"横の分割",en:"Divisions (u)"},   min:60, max:600, step:10, d:300},
    {k:"Nmax",l:{ja:"最大項数",en:"Max terms"},   min:3,  max:80,  step:1,  d:41},
    {k:"npow",l:{ja:"項数の増え方",en:"Term growth"},min:0.4,max:4,  step:0.1, d:1.6},
    {k:"kx",  l:{ja:"波数",en:"Wave number"},       min:0.004,max:0.05,step:0.0005,d:0.0155},
    {k:"amp", l:{ja:"振幅",en:"Amplitude"},       min:5,  max:150, step:1,  d:46},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},   min:0.2,max:3,   step:0.05,d:0.5},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},   min:1,  max:8,   step:0.1, d:3.4},
    {k:"pow", l:{ja:"階調カーブ",en:"Tone curve"}, min:0.4,max:3,   step:0.05,d:1.3},
    {k:"ox",  l:{ja:"位置 x",en:"Offset x"}, min:-2000,max:2000,step:10, d:0},
    {k:"oy",  l:{ja:"位置 y",en:"Offset y"}, min:-2000,max:2000,step:10, d:0},
  ],
  gen(p,W,H){
    const out=[], rows=Math.round(p.rows), cols=Math.round(p.cols);
    for(let j=0;j<=rows;j++){
      const v=j/rows, N=1+Math.round(Math.pow(v,p.npow)*p.Nmax), y0=-H*0.06+v*H*1.13+p.oy;
      for(let i=0;i<=cols;i++){
        const x=-W*0.03+i/cols*W*1.06;
        let s=0; for(let n=1;n<=N;n+=2) s+=Math.sin(n*((x-p.ox)*p.kx))/n;
        s*=4/Math.PI;
        const y=y0+s*p.amp;
        if(x<-25||x>W+25||y<-25||y>H+25) continue;
        const ring=Math.min(1,Math.abs(s));
        out.push({x,y,r:p.rmin+(p.rmax-p.rmin)*Math.pow(ring,p.pow)});
      }
    }
    return out;
  }
};

    {k:"rows",l:{ja:"行数",en:"Rows"},       min:10, max:160, step:2,  d:54},
    {k:"cols",l:{ja:"列数",en:"Columns"},       min:20, max:300, step:5,  d:110},
    {k:"a0",  l:{ja:"開始角",en:"Start angle"},     min:-1.5,max:1.5,step:0.05,d:-0.55},
    {k:"a1",  l:{ja:"終了角",en:"End angle"},     min:-1.5,max:1.5,step:0.05,d:0.95},
    {k:"sc",  l:{ja:"伸縮",en:"Stretch"},       min:0,  max:1,   step:0.02,d:0.42},
    {k:"sf",  l:{ja:"伸縮の周期",en:"Stretch period"}, min:0.3,max:3,   step:0.1, d:1.3},
    {k:"spanx",l:{ja:"横の広がり",en:"Width extent"},min:600,max:2600,step:20, d:1500},
    {k:"spany",l:{ja:"縦の広がり",en:"Height extent"},min:300,max:1600,step:20, d:760},
    {k:"shear",l:{ja:"せん断",en:"Shear"},    min:0,  max:1,   step:0.02,d:0.42},
    {k:"con", l:{ja:"コントラスト",en:"Contrast"},min:0.2,max:2.5,step:0.05,d:1.4},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},   min:0.2,max:3,   step:0.05,d:0.4},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},   min:1,  max:8,   step:0.1, d:3.6},
    {k:"ox",  l:{ja:"位置 x",en:"Offset x"}, min:-2000,max:2000,step:10, d:0},
    {k:"oy",  l:{ja:"位置 y",en:"Offset y"}, min:-2000,max:2000,step:10, d:0},
  ],
  gen(p,W,H){
    const out=[], rows=Math.round(p.rows), cols=Math.round(p.cols);
    for(let j=0;j<=rows;j++){
      const v=j/rows;
      const ang=(p.a0+(p.a1-p.a0)*v);
      const s=1+p.sc*Math.sin(Math.PI*v*p.sf);
      const ca=Math.cos(ang), sa=Math.sin(ang);
      for(let i=0;i<=cols;i++){
        const u=i/cols;
        const lx=(u-0.5)*p.spanx*s, ly=(v-0.5)*p.spany;
        const x=W/2+p.ox+lx*ca-ly*sa*0.28, y=H/2+p.oy+lx*sa*p.shear+ly;
        if(x<-20||x>W+20||y<-20||y>H+20) continue;
        const dens=Math.abs(ca)*s;
        const m=clamp01((1.15-dens*0.62)*p.con);
        out.push({x,y,r:p.rmin+(p.rmax-p.rmin)*m});
      }
    }
    return out;
  }
};

  doc:{"ja":"<b>焦線のしくみ</b><br><code>F(x,y) = (x + A sin(k₁y + k₃x), y + B sin(k₂x − k₃y))</code> のヤコビアンの絶対値 <code>|J|</code> を使います。局所面積が小さくなる場所ほど、ドットを大きくします。<br><b>筋を出す</b> — 模様がぼんやりしているときは、振幅A・Bを上げてみてください。ヤコビアンがゼロをまたぐと、強い帯が現れます。","en":"<b>How caustics work</b><br>The field uses the absolute Jacobian <code>|J|</code> of <code>F(x,y) = (x + A sin(k₁y + k₃x), y + B sin(k₂x − k₃y))</code>. Smaller local areas produce larger dots.<br><b>Bring out the bands</b> — If the pattern is faint, increase amplitudes A and B. Strong bands appear where the Jacobian crosses zero."},
  params:[
    {k:"step",l:{ja:"格子の間隔",en:"Sample spacing"}, min:4,  max:20,  step:0.5, d:8.5},
    {k:"A",   l:{ja:"振幅 A",en:"Amplitude A"},     min:0,  max:400, step:5,  d:180},
    {k:"B",   l:{ja:"振幅 B",en:"Amplitude B"},     min:0,  max:400, step:5,  d:150},
    {k:"k1",  l:{ja:"k₁",en:"k₁"},         min:0.001,max:0.03,step:0.0005,d:0.0068},
    {k:"k2",  l:{ja:"k₂",en:"k₂"},         min:0.001,max:0.03,step:0.0005,d:0.0091},
    {k:"k3",  l:{ja:"k₃",en:"k₃"},         min:0.001,max:0.03,step:0.0005,d:0.0055},
    {k:"gain",l:{ja:"感度",en:"Sensitivity"},       min:0.1,max:3,   step:0.05,d:0.62},
    {k:"floor",l:{ja:"下駄",en:"Floor"},      min:0.01,max:1,  step:0.01,d:0.10},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},   min:0.2,max:3,   step:0.05,d:0.35},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},   min:1,  max:8,   step:0.1, d:3.65},
    {k:"pow", l:{ja:"階調カーブ",en:"Tone curve"}, min:0.4,max:3,   step:0.05,d:1.5},
    {k:"ox",  l:{ja:"位置 x",en:"Offset x"}, min:-2000,max:2000,step:10, d:0},
    {k:"oy",  l:{ja:"位置 y",en:"Offset y"}, min:-2000,max:2000,step:10, d:0},
  ],
  gen(p,W,H){
    const out=[];
    const J=(x,y)=>{
      const c1=Math.cos(p.k1*y+p.k3*x), c2=Math.cos(p.k2*x-p.k3*y);
      const fxx=1+p.A*p.k3*c1, fxy=p.A*p.k1*c1;
      const fyx=p.B*p.k2*c2,   fyy=1-p.B*p.k3*c2;
      return Math.abs(fxx*fyy-fxy*fyx);
    };
    for(let y=2; y<H; y+=p.step){ for(let x=2; x<W; x+=p.step){
      const m=clamp01(p.gain/(J(x-p.ox,y-p.oy)+p.floor));
      const r=p.rmin+(p.rmax-p.rmin)*Math.pow(m,p.pow);
      if(r>0.5) out.push({x,y,r});
    }}
    return out;
  }
};

  doc:{"ja":"<b>反応拡散のしくみ</b><br><code>∂u/∂t = Dᵤ∇²u − uv² + F(1−u)</code><br><code>∂v/∂t = D_v∇²v + uv² − (F+K)v</code><br>Gray-Scottモデルを、同じ初期条件から計算します。<br><b>最初の手がかり</b> — 迷路状なら <code>(F,K) = (0.030, 0.057)</code>、斑点状なら <code>(0.035, 0.062)</code> あたりから。<br><b>模様が出ないとき</b> — 「vの最大値」がほぼ0なら、反応が弱まっています。供給F・消失Kと、種の間隔・密度を調整してください。","en":"<b>How reaction–diffusion works</b><br><code>∂u/∂t = Dᵤ∇²u − uv² + F(1−u)</code><br><code>∂v/∂t = D_v∇²v + uv² − (F+K)v</code><br>The Gray-Scott model runs from repeatable initial conditions.<br><b>A starting point</b> — Try <code>(F,K) = (0.030, 0.057)</code> for a maze or <code>(0.035, 0.062)</code> for spots.<br><b>If the canvas stays empty</b> — A max v near zero means little reaction remains. Adjust feed F, kill K and the seed spacing or density."},
  params:[
    {k:"GW", l:{ja:"格子 幅",en:"Grid width"},     min:60, max:260, step:10, d:160},
    {k:"GH", l:{ja:"格子 高さ",en:"Grid height"},   min:40, max:160, step:4,  d:84},
    {k:"IT", l:{ja:"反復回数",en:"Iterations"},    min:200,max:5000,step:100,d:3000},
    {k:"F",  l:{ja:"供給 F",en:"Feed F"},      min:0.010,max:0.070,step:0.001,d:0.030},
    {k:"K",  l:{ja:"消失 K",en:"Kill K"},      min:0.040,max:0.075,step:0.001,d:0.057},
    {k:"Du", l:{ja:"拡散 Du",en:"Diffusion Du"},     min:0.05,max:0.24,step:0.01,d:0.16},
    {k:"Dv", l:{ja:"拡散 Dv",en:"Diffusion Dv"},     min:0.02,max:0.24,step:0.01,d:0.08},
    {k:"seed",l:{ja:"種の間隔",en:"Seed spacing"},   min:5,  max:30,  step:1,  d:11},
    {k:"sdens",l:{ja:"種の密度",en:"Seed density"},  min:0.1,max:1,   step:0.05,d:0.55},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},   min:0.2,max:3,   step:0.05,d:0.35},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},   min:1,  max:8,   step:0.1, d:3.95},
    {k:"pow", l:{ja:"階調カーブ",en:"Tone curve"}, min:0.4,max:3,   step:0.05,d:1.1}
  ],
  gen(p,W,H){
    // 陽解法・4近傍ラプラシアン・dt=1 の安定条件は D < 0.25。
    // 超えると値が発散して NaN になり、反応が死んだのと見分けがつかなくなる
    const Du=Math.min(p.Du, 0.24), Dv=Math.min(p.Dv, 0.24);
    const GW=Math.round(p.GW), GH=Math.round(p.GH), IT=Math.round(p.IT), n=GW*GH;
    let u=new Float32Array(n), v=new Float32Array(n), u2=new Float32Array(n), v2=new Float32Array(n);
    const hash=(i,j)=>{ const s=Math.sin(i*12.9898+j*78.233)*43758.5453; return s-Math.floor(s); };
    u.fill(1);
    const sp=Math.round(p.seed);
    for(let j=3;j<GH-3;j+=sp) for(let i=3;i<GW-3;i+=sp){
      if(hash(i,j)>p.sdens) continue;
      for(let b=-2;b<=2;b++) for(let a=-2;a<=2;a++){ const k=(j+b)*GW+(i+a); u[k]=0.25; v[k]=0.55; }
    }
    const idx=(i,j)=>((j+GH)%GH)*GW+((i+GW)%GW);
    for(let t=0;t<IT;t++){
      for(let j=0;j<GH;j++) for(let i=0;i<GW;i++){
        const k=j*GW+i;
        const lu=u[idx(i-1,j)]+u[idx(i+1,j)]+u[idx(i,j-1)]+u[idx(i,j+1)]-4*u[k];
        const lv=v[idx(i-1,j)]+v[idx(i+1,j)]+v[idx(i,j-1)]+v[idx(i,j+1)]-4*v[k];
        const uvv=u[k]*v[k]*v[k];
        u2[k]=u[k]+Du*lu-uvv+p.F*(1-u[k]);
        v2[k]=v[k]+Dv*lv+uvv-(p.F+p.K)*v[k];
      }
      let tmp=u; u=u2; u2=tmp; tmp=v; v=v2; v2=tmp;
    }
    let mx=0; for(let k=0;k<n;k++) if(v[k]>mx) mx=v[k];
    S.turing.lastMax = mx;
    const out=[], sx=W/GW, sy=H/GH;
    for(let j=0;j<GH;j++) for(let i=0;i<GW;i++){
      const m = mx>0.01 ? clamp01(v[j*GW+i]/mx) : 0;
      const r=p.rmin+(p.rmax-p.rmin)*Math.pow(m,p.pow);
      if(r>0.6) out.push({x:(i+0.5)*sx, y:(j+0.5)*sy, r});
    }
    return out;
  }
};

/* 座標とseedだけから決まる乱数。パンやサイズ変更でも同じ場を保つ。 */
function cellRandom(x,y,seed,salt=0){
  let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(seed|0,1442695041)^salt;
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;
  return (h>>>0)/4294967296;
}
function fieldSampling(p,W,H){
  // 最大サイズでも描画点を約9万に抑える。粒径も同率で補正する。
  const step=Math.max(p.step,Math.sqrt(W*H/90000));
  return {step,scale:step/p.step};
}
S.truchet={
  label:{ja:"トルーシェ（つながる円弧）",en:"Truchet (connected arcs)"},

  doc:{ja:"<b>トルーシェのしくみ</b><br>正方形の対角に、半径がタイル幅の半分の円弧を置きます。向きは座標とseedで決め、円弧からの距離を点の大きさに変えています。<br><b>表情を変える</b> — タイルを大きくするとゆったりした曲線に。「向きの偏り」を変えると、ランダムな迷路から整った輪へ近づきます。<br>大きなキャンバスでは約9万点を上限に、点の間隔と粒径を調整します。",en:"<b>How Truchet works</b><br>Each square contains arcs with a radius of half its width. Tile coordinates and a seed choose their orientation; distance to the arcs controls dot size.<br><b>Change the rhythm</b> — Larger tiles make broader curves. Orientation bias moves between meanders and ordered loops.<br>Large canvases adapt dot spacing and size to a budget of about 90,000 dots."},
  params:[
    {k:"cell",l:{ja:"タイルの大きさ",en:"Tile size"},min:60,max:360,step:10,d:180},
    {k:"width",l:{ja:"帯の幅",en:"Band width"},min:0.04,max:0.4,step:0.01,d:0.15},
    {k:"bias",l:{ja:"向きの偏り",en:"Orientation bias"},min:0,max:1,step:0.05,d:0.5},
    {k:"seed",l:{ja:"配置の種",en:"Arrangement seed"},min:1,max:9999,step:1,d:31},
    {k:"step",l:{ja:"点の間隔",en:"Dot spacing"},min:5,max:20,step:0.5,d:8},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},min:0.1,max:2,step:0.1,d:0.3},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},min:1,max:6,step:0.1,d:3.5},
    {k:"pow",l:{ja:"階調カーブ",en:"Tone curve"},min:0.4,max:3,step:0.1,d:0.8},
    {k:"ox",l:{ja:"位置 x",en:"Offset x"},min:-1000,max:1000,step:10,d:40},
    {k:"oy",l:{ja:"位置 y",en:"Offset y"},min:-1000,max:1000,step:10,d:30}
  ],
  gen(p,W,H){
    const out=[],{step,scale}=fieldSampling(p,W,H),L=p.cell;
    for(let y=step/2;y<H;y+=step)for(let x=step/2;x<W;x+=step){
      const gx=Math.floor((x-p.ox)/L),gy=Math.floor((y-p.oy)/L);
      const u=x-p.ox-gx*L,v=y-p.oy-gy*L;
      const flip=cellRandom(gx,gy,p.seed)<p.bias;
      const d1=Math.abs(Math.hypot(flip?u-L:u,v)-L/2);
      const d2=Math.abs(Math.hypot(flip?u:u-L,v-L)-L/2);
      const m=Math.pow(clamp01(1-Math.min(d1,d2)/(L*p.width)),p.pow);
      const r=(p.rmin+(p.rmax-p.rmin)*m)*scale;
      out.push({x,y,r});
    }
    return out;
  }
};
S.voronoi={
  label:{ja:"ボロノイ（セル模様）",en:"Voronoi (cellular field)"},
  note:{ja:"点と点のあいだに、細胞や石組みのような境界が生まれる。領域の大きさとゆらぎで、整った網目から有機的な模様へ。",en:"Scattered points divide the plane into cells. Adjust their spacing and irregularity to move from an ordered mesh to an organic texture."},
  doc:{ja:"<b>ボロノイのしくみ</b><br>各格子に1つずつ母点を置き、seedで位置をずらします。最も近い2点までの距離を <code>F₁, F₂</code> とすると、<code>F₂−F₁=0</code> が領域の境界です。この差から粒径を決めます。差は辺までの厳密な距離ではありません。<br><b>内と外を切り替える</b> — 「描く場所」で境界と内側を選べます。ゆらぎを下げると幾何的に、上げると自然な石組みのように。<br>大きなキャンバスでは約9万点を上限に、点の間隔と粒径を調整します。",en:"<b>How Voronoi works</b><br>One seeded point is placed in each grid cell. For the two nearest distances, <code>F₁</code> and <code>F₂</code>, cell boundaries lie where <code>F₂−F₁=0</code>. This difference controls dot size; it is not the exact distance to an edge.<br><b>Inside or outside</b> — Switch between borders and interiors. Less irregularity gives a geometric grid; more creates an organic mesh.<br>Large canvases adapt dot spacing and size to about 90,000 dots."},
  params:[
    {k:"cell",l:{ja:"領域の大きさ",en:"Cell size"},min:60,max:360,step:10,d:180},
    {k:"jitter",l:{ja:"母点のゆらぎ",en:"Point irregularity"},min:0,max:1,step:0.05,d:0.9},
    {k:"width",l:{ja:"境界の幅",en:"Border width"},min:0.03,max:0.5,step:0.01,d:0.22},
    {k:"mode",l:{ja:"描く場所",en:"Draw"},opts:[["edges",{ja:"境界",en:"Borders"}],["cells",{ja:"内側",en:"Interiors"}]],d:"edges"},
    {k:"seed",l:{ja:"配置の種",en:"Arrangement seed"},min:1,max:9999,step:1,d:73},
    {k:"step",l:{ja:"点の間隔",en:"Dot spacing"},min:5,max:20,step:0.5,d:8},
    {k:"rmin",l:{ja:"最小粒径",en:"Min dot size"},min:0.1,max:2,step:0.05,d:0.25},
    {k:"rmax",l:{ja:"最大粒径",en:"Max dot size"},min:1,max:6,step:0.1,d:3.5},
    {k:"pow",l:{ja:"階調カーブ",en:"Tone curve"},min:0.4,max:3,step:0.1,d:0.9},
    {k:"ox",l:{ja:"位置 x",en:"Offset x"},min:-1000,max:1000,step:10,d:30},
    {k:"oy",l:{ja:"位置 y",en:"Offset y"},min:-1000,max:1000,step:10,d:20}
  ],
  gen(p,W,H){
    const out=[],{step,scale}=fieldSampling(p,W,H),L=p.cell;
    const x0=Math.floor(-p.ox/L)-2,y0=Math.floor(-p.oy/L)-2;
    const x1=Math.floor((W-p.ox)/L)+2,y1=Math.floor((H-p.oy)/L)+2,sites=[];
    for(let gy=y0;gy<=y1;gy++){
      const row=[];
      for(let gx=x0;gx<=x1;gx++)row.push({x:(gx+0.5+(cellRandom(gx,gy,p.seed)-0.5)*p.jitter)*L+p.ox,y:(gy+0.5+(cellRandom(gx,gy,p.seed,0x5bd1e995)-0.5)*p.jitter)*L+p.oy});
      sites.push(row);
    }
    for(let y=step/2;y<H;y+=step)for(let x=step/2;x<W;x+=step){
      const gx=Math.floor((x-p.ox)/L)-x0,gy=Math.floor((y-p.oy)/L)-y0;
      let first=Infinity,second=Infinity;
      // 母点が元のセル内にあるので、5×5近傍で最近傍2点を捕捉する。
      for(let j=gy-2;j<=gy+2;j++)for(let i=gx-2;i<=gx+2;i++){
        const q=sites[j][i],d=(x-q.x)**2+(y-q.y)**2;
        if(d<first){second=first;first=d;}else if(d<second)second=d;
      }
      let m=clamp01(1-(Math.sqrt(second)-Math.sqrt(first))/(L*p.width));
      if(p.mode==="cells")m=1-m;
      const r=(p.rmin+(p.rmax-p.rmin)*Math.pow(m,p.pow))*scale;
      out.push({x,y,r});
    }
    return out;
  }
};

function normalizeParams(key,input){
  const values=input&&typeof input==="object"?input:{};
  return Object.fromEntries(S[key].params.map(spec=>{
    const v=values[spec.k];
    if(spec.opts)return [spec.k,spec.opts.some(o=>o[0]===v)?v:spec.d];
    return [spec.k,typeof v==="number"&&Number.isFinite(v)?Math.min(spec.max,Math.max(spec.min,v)):spec.d];
  }));
}
/* 構造を一目で伝える短い生成規則。詳しい式は各構造の解説に残す。 */
const FORMULAS={
  polar:"rᵢ = r₀ + i·Δr   |   m = cos(kθ + arᵢ + φ)",
  ribbon:"X(u,v) = P(u) + v·R(τ(u))N(u)",
  cloth:"h(u,v) = A(u)·sin(fᵤu + fᵥv + τu)",
  contour:"m(x,y) = frac(Σ aᵢ·sin(kᵢ·x + φᵢ))",
  twist:"x′ = R(α(v)) · S(v)x",
  moire:"d(x, Λ₂) = min ‖x − Rφ(p₂n)‖",
  quasi:"Σⱼ cos(k·(x cos θⱼ + y sin θⱼ) + ψⱼ)",
  gibbs:"f(x) = (4/π) Σₙ odd sin(nkx)/n",
  caustics:"tone(x,y) ∝ 1 / (|det DF(x,y)| + ε)",
  turing:"∂u/∂t = Dᵤ∇²u − uv² + F(1−u)\n∂v/∂t = Dᵥ∇²v + uv² − (F+K)v",
  truchet:"m(x) = 1 − d(x, arc)/(L·w)",
  voronoi:"m(x) = 1 − (F₂(x) − F₁(x))/w"
};
function formulaFor(key,p){
  if(key==="conformal")return p&&p.fn==="jouk" ? "w = z + 1/z" : "w = z²";
  return FORMULAS[key]||"";
}

let timer=null, lastSVG="", hashPalette=null, pendingFormula=null, formulaTimer=null;

/* 幅高さを宣言どおりの範囲に丸め、コントロールにも書き戻す。
   丸めないと、ハッシュやファイル名が実際の書き出しと食い違い、
   上限を超えた値では生成ループが膨らんでページが固まる */
const DIM={min:100, max:4000};
function normDims(){
  const fix=(id,fb)=>{
    let v=parseInt($(id).value);
    if(!isFinite(v)) v=fb;
    v=Math.max(DIM.min, Math.min(DIM.max, v));
    if(String(v)!==$(id).value) $(id).value=v;
    return v;
  };
  return [fix("cw",1200), fix("ch",630)];
}

function render(){
  syncPaletteSwatches();
  if(timer) clearTimeout(timer);
  $("mBusy").innerHTML='<span class="busy">'+T(UI.busy)+'</span>';
  timer=setTimeout(doRender,60);
}
/* 保留中の描画を今すぐ流す。書き出し前に呼ぶ */
function flush(){
  if(timer){ clearTimeout(timer); timer=null; doRender(); }
}
function doRender(){
    timer=null;
    const [W,H]=normDims();
    const op=[parseFloat($("op0").value),parseFloat($("op1").value),parseFloat($("op2").value)];
    const bg=$("transparent").checked ? null : currentPaint("bg");
    const a=parseInt($("angle").value);
    const deg=isFinite(a)?a:90;   // 0度は有効な値なので || で潰さない
    let dots=[];
    const t0=performance.now();
    try{ dots=S[cur].gen(P,W,H); }catch(e){ $("mBusy").textContent=T(UI.genError)+e.message; return; }
    lastSVG=svgFromDots(W,H,dots,currentPaint("fg"),op,bg,deg);
    const preview=$("preview");
    const formulaOverlay=pendingFormula===cur ? preview.querySelector(".formula-intro") : null;
    preview.innerHTML=lastSVG;
    if(formulaOverlay){ preview.append(formulaOverlay); startFormulaTransition(cur); }
    // 生成だけでなく、文字列の組み立てと DOM への反映まで含めて測る。
    // 密なパターンはここが支配的で、生成だけ見ると「軽い」と誤判定する
    lastDrawMs=performance.now()-t0;
    $("mCount").textContent=dots.length.toLocaleString();
    $("mSize").textContent=W+" × "+H;
    $("mBytes").textContent=(lastSVG.length/1024).toFixed(0)+" KB";
    $("mBusy").innerHTML = (cur==="turing" && S.turing.lastMax!==undefined)
      ? (T(UI.vmax)+S.turing.lastMax.toExponential(2)
         + (S.turing.lastMax<0.01 ? T(UI.dead) : ""))
      : "";
    updateScaleOptions(W,H);
    $("recipe").value = cur+" / "+W+"×"+H+"\n"
      + S[cur].params.map(s=>s.k+": "+P[s.k]).join(", ");
}

function prepareFormulaTransition(key){
  const preview=$("preview"), equation=formulaFor(key,P);
  clearTimeout(formulaTimer);
  preview.classList.remove("formula-transition");
  preview.querySelector(".formula-intro")?.remove();
  pendingFormula=null;
  if(!equation||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const overlay=document.createElement("div");
  overlay.className="formula-intro"; overlay.setAttribute("aria-hidden","true");
  const bg=$("transparent").checked ? "#f5f5f1" : currentPaint("bg");
  overlay.style.background=Array.isArray(bg)?"linear-gradient("+$("angle").value+"deg,"+bg.join(",")+")":bg;
  overlay.style.color=$("fg").value;
  const inner=document.createElement("div"); inner.className="formula-intro-inner";
  const kicker=document.createElement("div"); kicker.className="formula-kicker"; kicker.textContent="GENERATING RULE";
  const code=document.createElement("div"); code.className="formula-equation"; code.textContent=equation;
  const name=document.createElement("div"); name.className="formula-name"; name.textContent=T(S[key].label);
  inner.append(kicker,code,name); overlay.append(inner); preview.append(overlay);
  pendingFormula=key;
}
function startFormulaTransition(key){
  const preview=$("preview"),overlay=preview.querySelector(".formula-intro");
  if(pendingFormula!==key||!overlay)return;
  pendingFormula=null;
  void preview.offsetWidth; preview.classList.add("formula-transition");
  formulaTimer=setTimeout(()=>{preview.classList.remove("formula-transition");overlay.remove();},900);
}

/* 状態入りURLは明示的に共有するときだけ作る。通常のアドレスバーは短く保つ */
function stateObject(){
  return {s:cur,w:$("cw").value,h:$("ch").value,fg:$("fg").value,bg:$("bg").value,
    f2:$("fg2").value,b2:$("bg2").value,fG:$("fgGrad").checked?1:0,bG:$("bgGrad").checked?1:0,
    ang:$("angle").value,pal:$("palette").value,
    t:$("transparent").checked?1:0,op:[$("op0").value,$("op1").value,$("op2").value],p:P};
}
function stateHash(){ return "#"+encodeURIComponent(JSON.stringify(stateObject())); }
function patternURL(){
  const url=new URL(location.href);
  url.hash=stateHash();
  return url.href;
}
function clearStateFromAddressBar(){
  if(!location.hash) return;
  const url=new URL(location.href);
  url.hash="";
  history.replaceState(null,"",url.href);
}
function readHash(){
  if(!location.hash || location.hash.length<3) return false;
  try{
    const o=JSON.parse(decodeURIComponent(location.hash.slice(1)));
    if(!o||typeof o.s!=="string"||!Object.hasOwn(S,o.s)) return false;
    cur=o.s; P=normalizeParams(cur,o.p);
    $("cw").value=o.w; $("ch").value=o.h; $("fg").value=o.fg; $("bg").value=o.bg;
    if(o.f2) $("fg2").value=o.f2;
    if(o.b2) $("bg2").value=o.b2;
    $("fgGrad").checked=!!o.fG; $("bgGrad").checked=!!o.bG;
    if(o.ang!=null){ $("angle").value=o.ang; $("v_angle").textContent=o.ang; }
    hashPalette = o.pal || null;
    $("transparent").checked=!!o.t;
    syncPaintUI();
    if(o.op){ $("op0").value=o.op[0]; $("op1").value=o.op[1]; $("op2").value=o.op[2]; }
    normDims();
    syncPreset();
    return true;
  }catch(e){ return false; }
}

$("shuffle").addEventListener("click",()=>{
  for(const s of S[cur].params){
    if(s.opts){ P[s.k]=s.opts[Math.floor(Math.random()*s.opts.length)][0]; continue; }
    // 重さに効くもの・位置は振らない（位置を振ると有限な模様が画面外へ出て真っ白になる）
    if(/^(GW|GH|IT|Nu|Nv|rows|cols|Na|Nb|step|ox|oy)$/.test(s.k)) continue;
    const v=s.min+Math.random()*(s.max-s.min);
    P[s.k]= s.step>=1 ? Math.round(v/s.step)*s.step : parseFloat(v.toFixed(4));
  }
  buildParams(); trackEngagement("shape_randomize");
  trackEvent("shape_randomize",{structure:cur}); render();
});

/* canvas の上限は実装ごとに違う。iOS Safari は面積 16,777,216px で
   頭打ちだが、デスクトップの Chrome はその十数倍まで通る。

   端末の容量を先に測る実装にすると、PNG を書き出さない人にも大きな
   確保を強いることになる（それこそ避けたかった事故）。だから測らない。
   選択肢の絞り込みは机上の上限だけで行い、実際に使う canvas を作った
   ときに確かめる。確保はどのみち1回必要なので、余分な確保は起きない。 */
// ブラウザの上限ではなく、道具としての上限。8192px / 6700万px（約268MB）。
// 16000×16000 は Chrome なら通るが、1GiB 確保して数百MB の PNG が出るだけで
// 使い道がない。ここを超える組み合わせは最初から出さない。
const PNG_HARD_SIDE=8192, PNG_HARD_PX=6.7e7;
function pngFits(W,H,sc){
  const w=W*sc, h=H*sc;
  return w<=PNG_HARD_SIDE && h<=PNG_HARD_SIDE && w*h<=PNG_HARD_PX;
}

/* 確保して隅に印を書き、読み戻せるかで判定する。
   上限を超えた canvas は例外を投げるか、描いても中身が入らない。
   使える場合はその canvas をそのまま返す（作り直さない）。 */
function makeCanvas(W,H){
  if(!pngFits(W,H,1)) return null;
  let c=null;
  try{
    c=document.createElement("canvas"); c.width=W; c.height=H;
    if(c.width!==W||c.height!==H) throw 0;
    const x=c.getContext("2d"); if(!x) throw 0;
    x.fillStyle="#010203"; x.fillRect(W-1,H-1,1,1);
    const d=x.getImageData(W-1,H-1,1,1).data;
    if(!(d[0]===1&&d[1]===2&&d[2]===3)) throw 0;
    x.clearRect(W-1,H-1,1,1);
    return c;
  }catch(e){
    if(c){ c.width=0; c.height=0; }
    return null;
  }
}

/* 倍率の選択肢に実寸を出し、机上の上限を超えるものを無効にする */
function updateScaleOptions(W,H){
  const sel=$("pngScale");
  let best=null;
  for(const o of sel.options){
    const sc=parseInt(o.value), ok=pngFits(W,H,sc);
    o.disabled=!ok;
    o.textContent = "× "+sc+(ok ? "  "+(W*sc)+"×"+(H*sc) : "");
    if(ok) best=o.value;
  }
  if(sel.selectedOptions[0] && sel.selectedOptions[0].disabled && best!=null) sel.value=best;
}

/* SVG を canvas に描いて PNG にする。
   外部リソースを一切参照していないので canvas が汚染されず toBlob が通る。
   地を透明にしていれば PNG もアルファ付きで出る。 */
function exportPNG(){
  flush();
  const cw=parseInt($("cw").value), ch=parseInt($("ch").value);
  const want=parseInt($("pngScale").value)||2;
  const btn=$("dlpng"), label=T(UI.savePng);
  btn.disabled=true; btn.textContent=T(UI.pngBusy);
  const done=(msg)=>{ btn.disabled=false; btn.textContent=msg||label;
    if(msg) setTimeout(()=>{btn.textContent=label;},2000); };

  // 実際に使う canvas を、大きい方から順に確保できるまで試す。
  // ×1 でも確保できない端末なら、そこで諦めて知らせる。
  let c=null, scale=want;
  for(; scale>=1; scale--){
    c=makeCanvas(Math.round(cw*scale), Math.round(ch*scale));
    if(c) break;
  }
  if(!c){ done(T(UI.pngTooBig)); return; }

  const W=c.width, H=c.height;
  const url=URL.createObjectURL(new Blob([lastSVG],{type:"image/svg+xml;charset=utf-8"}));
  const img=new Image();
  const cleanup=()=>{ URL.revokeObjectURL(url); c.width=0; c.height=0; };
  img.onload=()=>{
    try{
      const ctx=c.getContext("2d");
      ctx.imageSmoothingEnabled=true;
      ctx.drawImage(img,0,0,W,H);
      c.toBlob(bl=>{
        if(!bl){ cleanup(); done(T(UI.pngFail)); return; }
        const a=document.createElement("a");
        a.href=URL.createObjectURL(bl);
        a.download="pattern-"+cur+"-"+W+"x"+H+".png";
        a.click();
        trackEvent("pattern_export",{format:"png",structure:cur,width:W,height:H,scale:scale});
        setTimeout(()=>URL.revokeObjectURL(a.href),1000);
        cleanup();
        done(scale<want ? T(UI.pngReduced).replace("{n}",scale) : null);
      },"image/png");
    }catch(e){ cleanup(); done(T(UI.pngFail)); }
  };
  img.onerror=()=>{ cleanup(); done(T(UI.pngFail)); };
  img.src=url;
}
$("dlpng").addEventListener("click",exportPNG);

/* ── 図をドラッグして動かす ────────────────────────────
   構造ごとに「位置」を持つパラメータが違うので対応表を持つ。
   反応拡散だけは格子上で反復するため、ずらすには配列を回すことに
   なって重い。ここは対象外にする。

   グラデーションは userSpaceOnUse で画面座標に固定してあるので、
   模様だけ動いてグラデは止まったままになる。 */
const DRAG={
  polar:["cx","cy"], conformal:["cx","cy"], ribbon:["x0","y0"],
  cloth:["ox","oy"], twist:["ox","oy"], quasi:["ox","oy"],
  contour:["ox","oy"], moire:["ox","oy"], gibbs:["ox","oy"], caustics:["ox","oy"],
  truchet:["ox","oy"], voronoi:["ox","oy"]
};

let lastDrawMs=0;                    // 直近の描画にかかった時間。重い構造を見分ける
let drag=null, lastDragDraw=0;

function paramSpec(key){ return S[cur].params.find(x=>x.k===key); }
function setParam(key,val){
  const sp=paramSpec(key); if(!sp) return;
  const v=Math.max(sp.min, Math.min(sp.max, Math.round(val/sp.step)*sp.step));
  P[key]=v;
  const inp=$("p_"+key), lab=$("v_"+key);
  if(inp) inp.value=v;
  if(lab){
    const dec = sp.step<0.01 ? 4 : (sp.step<1 ? (String(sp.step).split(".")[1]||"").length : 0);
    lab.textContent=Number(v).toFixed(dec);
  }
}

function dragEnabled(){ return !!DRAG[cur]; }
function updateDragCursor(){
  const on=dragEnabled();
  $("preview").style.cursor = on ? "grab" : "";
  // preventDefault だけではポインタイベントのジェスチャ交渉から
  // 確実には降りられない。touch-action で明示する
  $("preview").style.touchAction = on ? "none" : "";
}

$("preview").addEventListener("pointerdown",(e)=>{
  if(!dragEnabled()) return;
  if(drag) return;                       // 既に掴んでいるなら2本目は無視
  if(e.pointerType==="mouse" && e.button!==0) return;   // 左ボタン以外は拾わない
  const keys=DRAG[cur];
  const sx=paramSpec(keys[0]), sy=paramSpec(keys[1]);
  if(!sx||!sy) return;
  // 保留中の描画があると、P は新しい値なのに表示は古い絵のままになる。
  // 捨てると基準がずれるので、先に流し切ってから掴む
  flush();
  const rect=$("preview").getBoundingClientRect();
  const W=parseInt($("cw").value)||1200;
  drag={ id:e.pointerId, keys, x0:e.clientX, y0:e.clientY,
         px:P[keys[0]], py:P[keys[1]],
         scale: W/Math.max(1,rect.width),   // 表示は縮んでいるのでキャンバス座標へ直す
         light: lastDrawMs<40 };            // 軽い構造は即時、重い構造は離してから
  $("preview").setPointerCapture(e.pointerId);
  $("preview").style.cursor="grabbing";
  e.preventDefault();
});

$("preview").addEventListener("pointermove",(e)=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dx=(e.clientX-drag.x0)*drag.scale, dy=(e.clientY-drag.y0)*drag.scale;
  setParam(drag.keys[0], drag.px+dx);
  setParam(drag.keys[1], drag.py+dy);
  if(drag.light){
    // render() は 60ms 遅延するので、動かし続けると毎回タイマーが
    // 積み直されて一向に描かれない。デバウンスを迂回して直接描く。
    // requestAnimationFrame は非表示タブで止まるので使わない
    const now=performance.now();
    if(now-lastDragDraw>16){
      lastDragDraw=now;
      if(timer){ clearTimeout(timer); timer=null; }
      doRender();
    }
  }else{
    // 重い構造はドラッグ中だけ見た目をずらしておき、離したときに作り直す。
    // 動かすのはドットのパスだけ。SVG ごと動かすと地とグラデまで動く。
    // ずらす量はポインタの生の差分ではなく、実際に反映された値から出す。
    // そうしないと端で頭打ちになったあとも動き続け、離した瞬間に戻る
    // SVG の中の要素に当てる CSS transform は user unit（viewBox 座標）で
    // 解釈される。表示が縮んでいても割ってはいけない
    const ax=P[drag.keys[0]]-drag.px, ay=P[drag.keys[1]]-drag.py;
    const t="translate("+ax+"px,"+ay+"px)";
    for(const path of $("preview").querySelectorAll("svg > path")) path.style.transform=t;
    // パスを動かすと、その user space に乗っているグラデーションも一緒に動く。
    // 同じ座標系なので、そのまま逆向きに戻す
    const fg=$("preview").querySelector('linearGradient[id^="fg-"]');
    if(fg) fg.setAttribute("gradientTransform","translate("+(-ax)+","+(-ay)+")");
  }
});

function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.id)) return;
  trackEngagement("canvas_drag");
  drag=null; lastDragDraw=0;
  $("preview").style.cursor=dragEnabled()?"grab":"";
  // 平行移動を先に外すと、描き直すまでの間だけ元の位置が見えて瞬く。
  // 先に描き直し、そのあとで（新しい SVG に対して）transform を消す
  if(timer){ clearTimeout(timer); timer=null; }
  doRender();
  for(const path of $("preview").querySelectorAll("svg > path")) path.style.transform="";
  const fgG=$("preview").querySelector('linearGradient[id^="fg-"]');
  if(fgG) fgG.removeAttribute("gradientTransform");
}
$("preview").addEventListener("pointerup",endDrag);
$("preview").addEventListener("pointercancel",endDrag);

/* ── 操作パネル: 設定値は保持したまま、作業ごとに切り替える ── */
function showControlPane(key){
  for(const id of ["shape","color","export"]){
    const active=id===key;
    $("tab-"+id).setAttribute("aria-selected",active);
    $("tab-"+id).tabIndex=active?0:-1;
    $("pane-"+id).hidden=!active;
  }
}
function syncPaletteSwatches(){
  if(!$("paletteSwatches")) return;
  for(const button of $("paletteSwatches").querySelectorAll("button"))button.setAttribute("aria-pressed",button.dataset.palette===$("palette").value);
  $("fgHex").textContent=$("fg").value.toUpperCase();
  $("bgHex").textContent=$("bg").value.toUpperCase();
}
function buildPaletteSwatches(){
  $("paletteSwatches").replaceChildren();
  const paint=v=>Array.isArray(v)?"linear-gradient(135deg,"+v.join(",")+")":v;
  for(const p of PALETTES){
    const button=document.createElement("button");button.type="button";button.dataset.palette=p.id;
    button.setAttribute("aria-label",T(p.name));button.title=T(p.name);
    for(const v of [p.bg,p.fg]){const chip=document.createElement("span");chip.style.background=paint(v);button.appendChild(chip);}
    button.addEventListener("click",()=>{$("palette").value=p.id;$("palette").dispatchEvent(new Event("change"));});
    $("paletteSwatches").appendChild(button);
  }
  syncPaletteSwatches();
}
const controlKeys=["shape","color","export"];
controlKeys.forEach((key,index)=>{
  $("tab-"+key).addEventListener("click",()=>showControlPane(key));
  $("tab-"+key).addEventListener("keydown",event=>{
    const next=event.key==="ArrowRight"?(index+1)%3:event.key==="ArrowLeft"?(index+2)%3:event.key==="Home"?0:event.key==="End"?2:null;
    if(next===null)return;event.preventDefault();showControlPane(controlKeys[next]);$("tab-"+controlKeys[next]).focus();
  });
});
$("quickExport").addEventListener("click",()=>{showControlPane("export");$("tab-export").focus();});

  flush();
  trackEvent("structure_gallery_open",{structure:cur});
  try{

  applyPalette(DEFAULT_PALETTE);
}

buildStructSelect(); $("struct").value=cur;
applyLang();
